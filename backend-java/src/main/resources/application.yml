server:
  port: ${PORT:5002}
  servlet:
    context-path: /

spring:
  application:
    name: collaborative-dashboard-java
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/collaborative-dashboard}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server.error.include-message: always
