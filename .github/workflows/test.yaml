name: Node.js CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Spin up a real MongoDB instance alongside your runner
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-node-version: '20' # Match your local Node version if different
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 2. Pass the dynamic connection string to your Mongoose configuration
      - name: Run Vitest Suite with Coverage
        run: npm run test:coverage
        env:
          MONGO_URL: mongodb://localhost:27017/test_db
          NODE_ENV: test